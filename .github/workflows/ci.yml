name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          # Temporarily disabled while cross-platform CI is stabilized.
          # - windows-2025
          # - ubuntu-24.04
    # Native modules must be rebuilt against Electron on every platform we ship.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the `postinstall` rebuild automatically; the explicit
      # @electron/rebuild below is a belt-and-suspenders guard for the top setup risk.
      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npx @electron/rebuild -f -w better-sqlite3,node-pty

      - name: Full gate (tsc -b && eslint && vitest run && electron-vite build)
        run: npm run check
