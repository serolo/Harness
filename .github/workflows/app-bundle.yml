name: App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            host_arch: arm64
            binary_arch: arm64
            app_dir: mac-arm64
          - arch: x64
            runner: macos-15-intel
            host_arch: x86_64
            binary_arch: x86_64
            app_dir: mac
    # Native modules are rebuilt on a runner matching the target architecture.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npx @electron/rebuild -f -w better-sqlite3,node-pty

      - name: Materialize signing and notarization credentials
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          test -n "$MAC_CSC_LINK"
          test -n "$APPLE_API_KEY_BASE64"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, and notarize macOS bundle
        env:
          CSC_LINK: ${{ runner.temp }}/developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"
          npm run release:mac -- --${{ matrix.arch }}

      # electron-builder notarizes the app before it creates the DMG. Submit the
      # finished disk image separately so the distributable itself gets a ticket.
      - name: Notarize and staple macOS disk image
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          test "${#dmgs[@]}" -gt 0
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify signed and notarized DMG
        run: |
          app="dist/${{ matrix.app_dir }}/Harness.app"
          test -d "$app"
          sqlite_module="$(find "$app" -path '*/better-sqlite3/build/Release/better_sqlite3.node' -print -quit)"
          pty_module="$(find "$app" -path '*/node-pty/build/Release/pty.node' -print -quit)"
          test -n "$sqlite_module"
          test -n "$pty_module"

          verify_architecture() {
            local binary="$1"
            echo "$binary: $(lipo -archs "$binary")"
            lipo "$binary" -verify_arch '${{ matrix.binary_arch }}'
          }
          verify_architecture "$app/Contents/MacOS/Harness"
          verify_architecture "$sqlite_module"
          verify_architecture "$pty_module"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          dmg="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          xcrun stapler validate "$dmg"

          # electron-builder leaves DMGs unsigned by design. The stapler check
          # above validates the DMG ticket; verify the signed payload below.

          mount_point="$(mktemp -d)"
          cleanup_mount() {
            hdiutil detach "$mount_point" -quiet 2>/dev/null || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup_mount EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mount_point/Harness.app"
          spctl --assess --type execute --verbose=4 "$mount_point/Harness.app"
          cleanup_mount
          trap - EXIT

      - name: Remove signing credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload signed app bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Harness-signed-notarized-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/${{ matrix.app_dir }}/*.app
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npx @electron/rebuild -f -w better-sqlite3,node-pty

      - name: Materialize Windows signing certificate
        shell: pwsh
        env:
          WIN_CSC_LINK_BASE64: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK_BASE64)) { throw 'WIN_CSC_LINK is required' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\windows-code-signing.pfx", [Convert]::FromBase64String($env:WIN_CSC_LINK_BASE64))

      - name: Build and sign Windows installer
        shell: pwsh
        env:
          CSC_LINK: ${{ runner.temp }}\windows-code-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { throw 'WIN_CSC_KEY_PASSWORD is required' }
          npm run release:win -- --x64

      - name: Verify signed Windows output
        shell: pwsh
        run: |
          $app = 'dist\win-unpacked\Harness.exe'
          $sqlite = Get-ChildItem 'dist\win-unpacked' -Recurse -Filter 'better_sqlite3.node' | Select-Object -First 1 -ExpandProperty FullName
          $pty = Get-ChildItem 'dist\win-unpacked' -Recurse -Filter 'pty.node' | Select-Object -First 1 -ExpandProperty FullName
          if (!(Test-Path $app) -or !$sqlite -or !$pty) { throw 'Packaged Windows binaries are missing' }
          node scripts/verify-binary-architecture.mjs x64 $app $sqlite $pty
          if ((Get-AuthenticodeSignature $app).Status -ne 'Valid') { throw 'Harness.exe signature is invalid' }
          $installer = Get-ChildItem dist -File -Filter '*setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'NSIS installer is missing' }
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw 'Installer signature is invalid' }
          if (!(Test-Path 'dist\win-unpacked\resources\app-update.yml')) { throw 'Packaged updater config is missing' }
          if (!(Test-Path 'dist\latest.yml')) { throw 'Windows updater metadata is missing' }
          if (!(Test-Path "$($installer.FullName).blockmap")) { throw 'Windows updater blockmap is missing' }

      - name: Remove Windows signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\windows-code-signing.pfx" -Force -ErrorAction SilentlyContinue

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Harness-signed-Windows-x64-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npx @electron/rebuild -f -w better-sqlite3,node-pty

      - name: Build Linux packages
        run: npm run release:linux -- --x64

      - name: Verify Linux output
        run: |
          app="dist/linux-unpacked/harness"
          test -x "$app"
          sqlite_module="$(find dist/linux-unpacked -path '*/better-sqlite3/build/Release/better_sqlite3.node' -print -quit)"
          pty_module="$(find dist/linux-unpacked -path '*/node-pty/build/Release/pty.node' -print -quit)"
          test -n "$sqlite_module"
          test -n "$pty_module"
          node scripts/verify-binary-architecture.mjs x64 "$app" "$sqlite_module" "$pty_module"
          test -f dist/linux-unpacked/resources/app-update.yml
          test -f dist/latest-linux.yml
          find dist -maxdepth 1 -name '*.AppImage' -print -quit | grep -q .
          find dist -maxdepth 1 -name '*.AppImage.blockmap' -print -quit | grep -q .
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb" >/dev/null

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Harness-Linux-x64-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14
