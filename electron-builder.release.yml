extends: electron-builder.yml

# Production macOS and Windows releases fail closed unless a signing identity is available.
forceCodeSigning: true

publish:
  provider: github
  owner: serolo
  repo: Harness
  releaseType: draft

mac:
  target:
    - dmg
    - zip
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# Windows releases use the same forceCodeSigning gate above. CI materializes a
# dedicated Authenticode certificate as CSC_LINK before invoking electron-builder.
win:
  target:
    - nsis
  signAndEditExecutable: true

linux:
  target:
    - AppImage
    - deb
