name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  HARNESS_POSTHOG_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
  HARNESS_POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
  HARNESS_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  validate-release:
    name: Validate release
    runs-on: macos-15

    steps:
      - name: Require an existing v-prefixed tag
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package version
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" != "0.0.0"
          case "$PACKAGE_VERSION" in
            *-*) echo "Production releases must use a stable semver version" >&2; exit 1 ;;
          esac
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npx @electron/rebuild -f -w better-sqlite3,node-pty

      - name: Run repository gate
        run: npm run check

      - name: Upload telemetry source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run telemetry:upload-sourcemaps

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            host_arch: arm64
            binary_arch: arm64
            app_dir: mac-arm64
          - arch: x64
            runner: macos-15-intel
            host_arch: x86_64
            binary_arch: x86_64
            app_dir: mac
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify native build host
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npx @electron/rebuild -f -w better-sqlite3,node-pty

      - name: Materialize signing and notarization credentials
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          test -n "$MAC_CSC_LINK"
          test -n "$APPLE_API_KEY_BASE64"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, and notarize release candidate
        env:
          CSC_LINK: ${{ runner.temp }}/developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"
          npm run release:mac -- --${{ matrix.arch }}

      # electron-builder notarizes the app before it creates the DMG. Submit the
      # finished disk image separately so the distributable itself gets a ticket.
      - name: Notarize and staple macOS disk image
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          test "${#dmgs[@]}" -eq 1
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify signed and notarized release output
        env:
          APP_DIR: dist/${{ matrix.app_dir }}/Harness.app
          EXPECTED_ARCH: ${{ matrix.binary_arch }}
        run: |
          verify_architecture() {
            local binary="$1"
            file "$binary"
            lipo "$binary" -verify_arch "$EXPECTED_ARCH"
          }

          test -d "$APP_DIR"
          main_binary="$APP_DIR/Contents/MacOS/Harness"
          sqlite_module="$(find "$APP_DIR" -path '*/better-sqlite3/build/Release/better_sqlite3.node' -print -quit)"
          pty_module="$(find "$APP_DIR" -path '*/node-pty/build/Release/pty.node' -print -quit)"
          test -n "$sqlite_module"
          test -n "$pty_module"
          verify_architecture "$main_binary"
          verify_architecture "$sqlite_module"
          verify_architecture "$pty_module"

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          spctl --assess --type execute --verbose=4 "$APP_DIR"
          test -f "$APP_DIR/Contents/Resources/app-update.yml"
          test -f dist/latest-mac.yml
          find dist -maxdepth 1 -name '*.dmg' -print -quit | grep -q .
          find dist -maxdepth 1 -name '*.zip' -print -quit | grep -q .
          find dist -maxdepth 1 -name '*.blockmap' -print -quit | grep -q .
          while IFS= read -r native_module; do
            if file "$native_module" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$native_module"
            fi
          done < <(find "$APP_DIR" -name '*.node')
          for artifact in dist/*.dmg; do
            xcrun stapler validate "$artifact"
          done

          # electron-builder leaves DMGs unsigned by design. Validate each
          # stapled DMG above and assess the signed app payload below.
          dmg="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          mount_point="$(mktemp -d)"
          cleanup_mount() {
            hdiutil detach "$mount_point" -quiet 2>/dev/null || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup_mount EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg"
          verify_architecture "$mount_point/Harness.app/Contents/MacOS/Harness"
          codesign --verify --deep --strict --verbose=2 "$mount_point/Harness.app"
          spctl --assess --type execute --verbose=4 "$mount_point/Harness.app"
          cleanup_mount
          trap - EXIT

      - name: Stage verified release candidate
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          artifacts=(dist/*.dmg dist/*.zip dist/*.blockmap)
          test "${#artifacts[@]}" -eq 4
          stage="$RUNNER_TEMP/release-$RELEASE_ARCH"
          mkdir -p "$stage"
          cp "${artifacts[@]}" "$stage/"
          cp dist/latest-mac.yml "$stage/latest-mac-$RELEASE_ARCH.yml"

          checksum_file="$RUNNER_TEMP/release-$RELEASE_ARCH.sha256"
          (
            cd "$stage"
            for artifact in ./*; do
              shasum -a 256 "$artifact"
            done
          ) > "$checksum_file"
          mv "$checksum_file" "$stage/SHA256SUMS"

      - name: Remove signing credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Harness-release-macOS-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows (x64)
    needs: validate-release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npx @electron/rebuild -f -w better-sqlite3,node-pty

      - name: Materialize Windows signing certificate
        shell: pwsh
        env:
          WIN_CSC_LINK_BASE64: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK_BASE64)) { throw 'WIN_CSC_LINK is required' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\windows-code-signing.pfx", [Convert]::FromBase64String($env:WIN_CSC_LINK_BASE64))

      - name: Build and sign Windows release candidate
        shell: pwsh
        env:
          CSC_LINK: ${{ runner.temp }}\windows-code-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { throw 'WIN_CSC_KEY_PASSWORD is required' }
          npm run release:win -- --x64

      - name: Verify signed Windows release output
        shell: pwsh
        run: |
          $app = 'dist\win-unpacked\Harness.exe'
          $sqlite = Get-ChildItem 'dist\win-unpacked' -Recurse -Filter 'better_sqlite3.node' | Select-Object -First 1 -ExpandProperty FullName
          $pty = Get-ChildItem 'dist\win-unpacked' -Recurse -Filter 'pty.node' | Select-Object -First 1 -ExpandProperty FullName
          if (!(Test-Path $app) -or !$sqlite -or !$pty) { throw 'Packaged Windows binaries are missing' }
          node scripts/verify-binary-architecture.mjs x64 $app $sqlite $pty
          if ((Get-AuthenticodeSignature $app).Status -ne 'Valid') { throw 'Harness.exe signature is invalid' }
          $installer = Get-ChildItem dist -File -Filter '*setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'NSIS installer is missing' }
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw 'Installer signature is invalid' }
          if (!(Test-Path 'dist\win-unpacked\resources\app-update.yml')) { throw 'Packaged updater config is missing' }
          if (!(Test-Path 'dist\latest.yml')) { throw 'Windows updater metadata is missing' }
          if (!(Test-Path "$($installer.FullName).blockmap")) { throw 'Windows updater blockmap is missing' }

      - name: Stage verified Windows release candidate
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\release-windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          $artifacts = @(Get-ChildItem dist -File | Where-Object { $_.Name -match 'setup\.exe(?:\.blockmap)?$' })
          if ($artifacts.Count -ne 2) { throw "Expected two Windows installer assets, found $($artifacts.Count)" }
          Copy-Item $artifacts.FullName $stage
          Copy-Item 'dist\latest.yml' $stage
          $checksumFile = "$env:RUNNER_TEMP\windows-SHA256SUMS"
          Get-ChildItem $stage -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content $checksumFile -Encoding ascii
          Move-Item $checksumFile "$stage\SHA256SUMS"

      - name: Remove Windows signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\windows-code-signing.pfx" -Force -ErrorAction SilentlyContinue

      - name: Upload verified Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Harness-release-Windows-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/release-windows-x64/
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux (x64)
    needs: validate-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npx @electron/rebuild -f -w better-sqlite3,node-pty

      - name: Build Linux release candidate
        run: npm run release:linux -- --x64

      - name: Verify Linux release output
        run: |
          app="dist/linux-unpacked/harness"
          test -x "$app"
          sqlite_module="$(find dist/linux-unpacked -path '*/better-sqlite3/build/Release/better_sqlite3.node' -print -quit)"
          pty_module="$(find dist/linux-unpacked -path '*/node-pty/build/Release/pty.node' -print -quit)"
          test -n "$sqlite_module"
          test -n "$pty_module"
          node scripts/verify-binary-architecture.mjs x64 "$app" "$sqlite_module" "$pty_module"
          test -f dist/linux-unpacked/resources/app-update.yml
          test -f dist/latest-linux.yml
          find dist -maxdepth 1 -name '*.AppImage' -print -quit | grep -q .
          find dist -maxdepth 1 -name '*.AppImage.blockmap' -print -quit | grep -q .
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb" >/dev/null

      - name: Stage verified Linux release candidate
        run: |
          shopt -s nullglob
          artifacts=(dist/*.AppImage dist/*.AppImage.blockmap dist/*.deb)
          test "${#artifacts[@]}" -eq 3
          stage="$RUNNER_TEMP/release-linux-x64"
          mkdir -p "$stage"
          cp "${artifacts[@]}" dist/latest-linux.yml "$stage/"
          checksum_file="$RUNNER_TEMP/linux-SHA256SUMS"
          (
            cd "$stage"
            for artifact in ./*; do
              sha256sum "$artifact"
            done
          ) > "$checksum_file"
          mv "$checksum_file" "$stage/SHA256SUMS"

      - name: Upload verified Linux release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Harness-release-Linux-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/release-linux-x64/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish cross-platform release draft
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install metadata tooling
        run: npm ci --ignore-scripts

      - name: Download arm64 release candidate
        uses: actions/download-artifact@v4
        with:
          name: Harness-release-macOS-arm64-${{ github.run_id }}
          path: release-input/arm64

      - name: Download x64 release candidate
        uses: actions/download-artifact@v4
        with:
          name: Harness-release-macOS-x64-${{ github.run_id }}
          path: release-input/x64

      - name: Download Windows release candidate
        uses: actions/download-artifact@v4
        with:
          name: Harness-release-Windows-x64-${{ github.run_id }}
          path: release-input/windows-x64

      - name: Download Linux release candidate
        uses: actions/download-artifact@v4
        with:
          name: Harness-release-Linux-x64-${{ github.run_id }}
          path: release-input/linux-x64

      - name: Verify and combine release candidates
        run: |
          for arch in arm64 x64; do
            (
              cd "release-input/$arch"
              sha256sum --check SHA256SUMS
            )
          done
          for platform in windows-x64 linux-x64; do
            (
              cd "release-input/$platform"
              sha256sum --check SHA256SUMS
            )
          done

          mkdir release-assets
          shopt -s nullglob
          for arch in arm64 x64; do
            artifacts=(release-input/"$arch"/*.dmg release-input/"$arch"/*.zip release-input/"$arch"/*.blockmap)
            test "${#artifacts[@]}" -eq 4
            cp "${artifacts[@]}" release-assets/
          done

          node scripts/merge-mac-update-metadata.mjs \
            release-input/arm64/latest-mac-arm64.yml \
            release-input/x64/latest-mac-x64.yml \
            release-assets/latest-mac.yml

          cp release-input/windows-x64/*.exe release-input/windows-x64/*.blockmap \
            release-input/windows-x64/latest.yml release-assets/
          cp release-input/linux-x64/*.AppImage release-input/linux-x64/*.AppImage.blockmap \
            release-input/linux-x64/*.deb release-input/linux-x64/latest-linux.yml release-assets/

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$asset_count" = "16"
          find release-assets -maxdepth 1 -type f -print | sort > "$RUNNER_TEMP/release-assets.list"
          while IFS= read -r artifact; do
            sha256sum "$artifact"
          done < "$RUNNER_TEMP/release-assets.list" > "$RUNNER_TEMP/release-assets.sha256"

      - name: Create draft and upload verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum --check "$RUNNER_TEMP/release-assets.sha256"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true"; then
              echo "Release $RELEASE_TAG already exists and is not a draft" >&2
              exit 1
            fi
            if test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" != "0"; then
              echo "Draft $RELEASE_TAG already contains assets; refusing to overwrite them" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "Harness $RELEASE_TAG" \
              --notes "Verified macOS arm64/x64, Windows x64, and Linux x64 release candidates. Review before publishing."
          fi

          release_assets=()
          while IFS= read -r artifact; do
            release_assets+=("$artifact")
          done < "$RUNNER_TEMP/release-assets.list"
          test "${#release_assets[@]}" -eq 16
          gh release upload "$RELEASE_TAG" "${release_assets[@]}"

          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = "${#release_assets[@]}"
